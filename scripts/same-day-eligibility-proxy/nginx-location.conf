    # Public same-day eligibility (prototype). No secret. GET only.
    # Do not point the LIVE theme here until workshop-os stock + reserve ship.
    location = /same-day/eligibility {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type";
            add_header Content-Length 0;
            return 204;
        }
        proxy_pass http://127.0.0.1:8061/same-day/eligibility;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-store" always;
        proxy_connect_timeout 2s;
        proxy_send_timeout 2s;
        proxy_read_timeout 2s;
    }
