    # Public same-day eligibility (prototype). No secret. GET + OPTIONS.
    # Do not point the LIVE theme here until workshop-os stock + reserve ship.
    # Do not add_header Access-Control-Allow-Origin here. The Node app already
    # sends it. A second copy becomes "*, *" and Chromium blocks the wizard.
    location = /same-day/eligibility {
        proxy_pass http://127.0.0.1:8061;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_send_timeout 2s;
        proxy_read_timeout 2s;
    }
