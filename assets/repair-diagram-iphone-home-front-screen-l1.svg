<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 132 262" width="132" height="262" fill="none" class="dg dg__svg dg--iphone dg--iphone-home dg--front dg--part-screen"><style>.dg {
--ri-ink: #1d1d1f;
--ri-ink-2: #6e6e73;
--ri-ink-3: #86868b;
--ri-line: rgba(0, 0, 0, 0.08);
--ri-line-strong: rgba(0, 0, 0, 0.14);
--ri-soft: #f5f5f7;
--ri-soft-2: #fafafa;
--ri-accent: #0070f3;
--ri-accent-soft: rgba(0, 112, 243, 0.1);
--ri-green: #1a6b34;
--ri-green-bg: #e6f6ec;
--ri-r-sm: 10px;
--ri-r-md: 16px;
--ri-r-lg: 24px;
--ri-shadow-lift: 0 1px 2px rgba(0, 0, 0, 0.04), 0 12px 32px -12px rgba(0, 0, 0, 0.18);
--ri-ease: 200ms cubic-bezier(0.2, 0.7, 0.2, 1);
}
.dg {
--dg-w: 200px;
--dg-hl: 1;
}
.dg__img {
display: block;
width: 110%;
max-width: none;
height: auto;
margin: -5%;
}
.dg__svg * {
vector-effect: non-scaling-stroke;
stroke: var(--ri-ink);
stroke-width: 1.5px;
stroke-linecap: round;
stroke-linejoin: round;
}
.dg-body { fill: #fff; stroke-width: 1.75px; }
.dg-btn,
.dg-crown { fill: #fff; }
.dg-base { fill: #fff; }
.dg-band { fill: var(--ri-soft); }
.dg-glass { fill: #fbfbfc; }
.dg-frame { fill: none; stroke: rgba(29, 29, 31, 0.12); stroke-width: 1px; }
.dg-screen { fill: #e9ebef; stroke: rgba(29, 29, 31, 0.22); }
.dg-sheen { fill: #fff; stroke: none; opacity: 0.6; }
.dg-shadow { fill: rgba(0, 0, 0, 0.07); stroke: none; }
.dg-cam { fill: #3a3a3c; stroke: none; }
.dg-island,
.dg-notch { fill: var(--ri-ink); stroke: none; }
.dg-earpiece--light { stroke: rgba(255, 255, 255, 0.35); }
.dg-home { fill: #fff; stroke: rgba(29, 29, 31, 0.45); }
.dg-plateau { fill: #f2f2f4; stroke: rgba(29, 29, 31, 0.55); }
.dg-lidar { fill: #2c2c2e; stroke: none; }
.dg-guard { fill: #fff; }
.dg-frame--bold { stroke: rgba(29, 29, 31, 0.5); stroke-width: 2.5px; }
.dg-slab { fill: #fff; }
.dg-lip { stroke: rgba(29, 29, 31, 0.22); }
.dg-touchbar-strip { fill: #2c2c2e; stroke: none; }
.dg-fnrow { stroke: rgba(29, 29, 31, 0.22); stroke-width: 2.4px; stroke-dasharray: 9 2.4; stroke-linecap: butt; }
.dg-grille--strip { stroke-width: 2px; stroke-dasharray: 0.1 3.2; }
.dg-flash { fill: #ececee; stroke: rgba(29, 29, 31, 0.4); }
.dg-module { fill: #f2f2f4; stroke: rgba(29, 29, 31, 0.55); }
.dg-lens-ring { fill: #fff; }
.dg-lens { fill: #2c2c2e; stroke: none; }
.dg-earpiece { stroke: rgba(29, 29, 31, 0.28); stroke-width: 1.6px; }
.dg-port { fill: #cfd1d5; stroke: none; }
.dg-port-side { stroke: #b9bcc2; stroke-width: 3px; }
.dg-grille,
.dg-leds { stroke: rgba(29, 29, 31, 0.4); stroke-width: 2.6px; }
.dg-hinge { stroke: rgba(29, 29, 31, 0.16); }
.dg-keyboard,
.dg-trackpad { fill: var(--ri-soft); stroke: rgba(29, 29, 31, 0.28); }
.dg-keys { stroke: rgba(29, 29, 31, 0.22); stroke-width: 2.4px; stroke-dasharray: 6 2.4; stroke-linecap: butt; }
.dg-sensor { fill: none; }
.dg-shatter,
.dg-fault,
.dg-blot,
.dg-fcam,
.dg-touchbar,
.dg-battery,
.dg-dust,
.dg-dustbands,
.dg-crack,
.dg-lens-crack,
.dg-scan { display: none; }
.dg .is-hl {
display: inline;
stroke: var(--ri-accent);
stroke-width: calc(1.5px * var(--dg-hl));
fill: var(--ri-accent-soft);
filter: drop-shadow(0 0 calc(5px * var(--dg-hl) * var(--dg-hl)) rgba(0, 112, 243, 0.4));
}
.dg .dg-cam.is-hl,
.dg .dg-island.is-hl,
.dg .dg-notch.is-hl,
.dg .dg-touchbar-strip.is-hl,
.dg .dg-fcam.is-hl,
.dg .dg-lens.is-hl,
.dg .dg-port.is-hl,
.dg .dg-touchbar.is-hl { fill: var(--ri-accent); }
.dg .dg-port.is-hl {
transform-box: fill-box;
transform-origin: center bottom;
transform: scaleY(clamp(1.5, 200px / (var(--dg-w) * var(--dg-scale, 1)), 6));
}
.dg .dg-lens-ring.is-hl { fill: #fff; }
.dg .dg-port-side.is-hl { stroke-width: calc(4.5px * var(--dg-hl)); }
.dg .dg-grille.is-hl,
.dg .dg-leds.is-hl { stroke-width: max(2.8px, calc(3.2px * var(--dg-hl))); }
.dg .dg-grille--dots.is-hl { stroke-width: max(10px, calc(11px * var(--dg-hl))); }
.dg .dg-dust.is-hl { stroke-width: calc(3.2px * var(--dg-hl)); }
.dg .dg-earpiece.is-hl { stroke-width: max(2.2px, calc(2.6px * var(--dg-hl))); }
.dg .dg-keys.is-hl,
.dg .dg-fnrow.is-hl { fill: none; stroke-width: calc(2.4px * var(--dg-hl)); }
.dg .dg-grille--strip.is-hl { stroke-width: calc(2.6px * var(--dg-hl)); }
.dg .dg-earpiece--light.is-hl { stroke: #fff; }
.dg .dg-battery.is-hl { stroke-dasharray: 4 3; }
.dg .dg-hinge.is-hl { stroke-width: calc(2.4px * var(--dg-hl)); }
.dg .dg-sensor.is-hl { fill: none; }
.dg .dg-screen.is-hl ~ .dg-sheen { opacity: 0.35; }
.dg--part-screen .dg-crack,
.dg--part-glass .dg-crack--back,
.dg--part-lens .dg-lens-crack {
display: inline;
fill: none;
stroke: var(--ri-accent);
stroke-width: calc(1.3px * var(--dg-hl));
}
.dg--part-glassfront .dg-screen { stroke: var(--ri-accent); stroke-width: calc(2px * var(--dg-hl)); }
.dg--part-glassfront .dg-shatter {
display: inline;
fill: none;
stroke: var(--ri-accent);
stroke-width: calc(1.2px * var(--dg-hl));
}
.dg--part-display .dg-screen { fill: #dfe2e8; }
.dg--part-display .dg-sheen { opacity: 0.7; }
.dg--part-display .dg-fault {
display: inline;
stroke: var(--ri-accent);
stroke-width: calc(1.6px * var(--dg-hl));
opacity: 0.85;
}
.dg--part-display .dg-fault--alt { stroke: #30b85c; }
.dg--part-display .dg-blot {
display: inline;
fill: #1d1d1f;
stroke: none;
opacity: 0.72;
filter: blur(calc(1.5px * var(--dg-hl)));
}
.dg--part-battery .dg-screen { fill: #f4f5f7; stroke-dasharray: 3 3; }
.dg--part-battery .dg-sheen { display: none; }
.dg--part-hinge .dg-screen { fill: #1c1c1e; }
.dg--part-hinge .dg-sheen { display: none; }
.dg--part-hinge .dg-hinge.is-hl {
stroke: rgba(29, 29, 31, 0.18);
fill: none;
filter: none;
}
.dg-dustband { stroke: none; }
.dg--part-dust .dg-dustbands { display: inline; }
.dg--part-dust .dg-dust { display: none; }
.dg--part-dust .dg-sheen { opacity: 0.2; }
.dg--part-dust .dg-dustband:nth-child(odd) { fill: rgba(0, 112, 243, 0.22); }
.dg--part-dust .dg-dustband:nth-child(even) { fill: rgba(0, 112, 243, 0.5); }
.dg--part-scan .dg-scan {
display: inline;
fill: var(--ri-accent);
stroke: none;
opacity: 0.55;
filter: drop-shadow(0 0 6px rgba(0, 112, 243, 0.6));
animation: dg-scan 3.2s ease-in-out infinite;
}
.dg--iphone { --dg-scan-travel: 214px; }
.dg--iphone-home { --dg-scan-travel: 160px; }
.dg--ipad { --dg-scan-travel: 210px; }
.dg--ipad-home { --dg-scan-travel: 180px; }
.dg--macbook { --dg-scan-travel: 100px; }
.dg--watch { --dg-scan-travel: 118px; }
.dg--watch-rounded { --dg-scan-travel: 128px; }
.dg--watch-s10 { --dg-scan-travel: 130px; }
.dg--watch-ultra { --dg-scan-travel: 114px; }
@keyframes dg-scan {
0%, 100% { transform: translateY(0); }
50% { transform: translateY(var(--dg-scan-travel)); }
}
@media (prefers-reduced-motion: reduce) {
.dg--part-scan .dg-scan { animation: none; transform: translateY(calc(var(--dg-scan-travel) / 2)); }
}</style><ellipse class="dg-shadow" cx="60" cy="244" rx="44" ry="3.5"></ellipse><rect class="dg-btn dg-btn-mute" height="10" rx="2.25" width="4.5" x="6.5" y="38"></rect><rect class="dg-btn dg-btn-volume" height="18" rx="2.25" width="4.5" x="6.5" y="56"></rect><rect class="dg-btn dg-btn-volume" height="18" rx="2.25" width="4.5" x="6.5" y="80"></rect><rect class="dg-btn dg-btn-power" height="26" rx="2.25" width="4.5" x="109" y="58"></rect><rect class="dg-body" height="232" rx="18" width="100" x="10" y="4"></rect><rect class="dg-frame" height="227" rx="15.5" width="95" x="12.5" y="6.5"></rect><rect class="dg-screen is-hl" height="166" rx="2" width="88" x="16" y="36"></rect><path class="dg-sheen" d="M56 36h20L16 146v-36z"></path><path class="dg-earpiece" d="M50 21h20"></path><circle class="dg-cam" cx="39" cy="21" r="2.6"></circle><circle class="dg-home" cx="60" cy="219" r="10"></circle><rect class="dg-port" height="3" rx="1.5" width="20" x="50" y="232"></rect><path class="dg-grille dg-grille--dots" d="M30 233.5h.01M35 233.5h.01M40 233.5h.01M80 233.5h.01M85 233.5h.01M90 233.5h.01"></path><rect class="dg-battery" height="116" rx="8" width="60" x="30" y="62"></rect><path class="dg-crack" d="M74 50l-10 26 14 8-16 30 9 7-12 26"></path><path class="dg-shatter" d="M72 86l-14-28M72 86l20-20M72 86l24 10M72 86l10 30M72 86l-18 24M72 86l-28-4M63 74l14-5 10 11-3 16-14 5-11-10z"></path><path class="dg-fault" d="M38 36v166M41.5 36v166"></path><path class="dg-fault dg-fault--alt" d="M80 36v166"></path><path class="dg-blot" d="M48 152c4-12 22-15 30-5 7 9 1 22-11 24-12 1-23-7-19-19z"></path><rect class="dg-scan" height="3" rx="1.5" width="88" x="16" y="36"></rect></svg>
