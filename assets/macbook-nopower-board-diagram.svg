  --bl:#38598C;--bl-dark:#2E4A72}
*{vector-effect:non-scaling-stroke}
path,circle,line{fill:none;stroke-linejoin:round;stroke-linecap:round}
.k{stroke:var(--ink);stroke-width:1.15}
.m{stroke:var(--mid);stroke-width:.85}
.h{stroke:var(--soft);stroke-width:.55}
.b{stroke:var(--bl);stroke-width:1.2}
.b-path{stroke:var(--bl-dark);stroke-width:2.4}
.b-path-after{stroke:var(--bl);stroke-width:1.6;stroke-dasharray:4 4;stroke-opacity:.55}
.d{stroke:var(--soft);stroke-width:.75;stroke-dasharray:3 4;stroke-linecap:butt}
.f-w{fill:#ffffff;fill-opacity:.92}
.f-50{fill:#fafafa;fill-opacity:.92}
.f-100{fill:#e5e7eb;fill-opacity:.92}
.f-200{fill:#d1d5db;fill-opacity:.92}
