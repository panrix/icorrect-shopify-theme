.shadow{fill:rgba(17,24,39,.045);stroke:none}
.break-ring{fill:#ffffff;stroke:#38598C;stroke-width:2}
.break-x{stroke:#38598C;stroke-width:2.2}
.node-dot{fill:#38598C;stroke:#ffffff;stroke-width:1.5}
]]></style>
