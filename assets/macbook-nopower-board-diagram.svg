.ld{stroke:var(--mid);stroke-width:.75}
.ld-b{stroke:var(--bl);stroke-width:.85}
.dot{fill:var(--ink);stroke:none}
.dot-b{fill:var(--bl);stroke:none}
text{font-family:"Geist Mono","SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;font-weight:500;font-size:11px;letter-spacing:.06em;fill:var(--mid)}
